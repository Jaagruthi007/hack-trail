<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Lullaby Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <a id="back" href="../../index.html">← Back to Pip</a>
    <canvas id="c" aria-label="Pip sitting on a music box that plays a lullaby"></canvas>
    <div id="hud"><span id="song">Pip's lullaby</span></div>

    <div id="panel">
      <h1>The Lullaby Lab</h1>
      <p>Pip has been writing tiny lullabies for the sleepy hours. Wind up the music box and Pip will hum along.</p>
      <p>Click or tap the dots on the roll to add or remove pins. Pip will play whatever you compose.</p>
      <button id="go" class="main">Wind it up</button>
    </div>
  </div>

  <div id="bar">
    <button id="play" class="main">Play</button>
    <button id="new">New lullaby</button>

    <div class="moods" role="group" aria-label="Mood">
      <button data-m="sleepy" aria-pressed="true">Sleepy</button>
      <button data-m="dreamy" aria-pressed="false">Dreamy</button>
      <button data-m="moonlit" aria-pressed="false">Moonlit</button>
    </div>

    <label class="tempo">Tempo
      <input id="bpm" type="range" min="40" max="110" value="64">
      <output id="bpmv">64</output>
    </label>

    <label class="chk"><input type="checkbox" id="hum" checked> Pip hums along</label>
    <button id="clear">Clear pins</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
