<!-- ===================== THE LULLABY LAB ===================== -->
<section class="lullaby-lab" id="lullabyLab" aria-labelledby="llTitle">

  <header class="ll-head">
    <div class="ll-pip" aria-hidden="true">
      <img class="ll-pip-img ll-pip-night" src="pip_night.png" alt="" />
      <img class="ll-pip-img ll-pip-day" src="pip_day.png" alt="" />
    </div>
    <div class="ll-head-text">
      <p class="ll-eyebrow">Pip's Nursery · Experiment #1</p>
      <h2 id="llTitle">🎶 The Lullaby Lab</h2>
      <p class="ll-sub">Pip built a tiny music-box engine. Wind it up and it composes a brand-new lullaby, just for you.</p>
    </div>
  </header>

  <div class="ll-now" aria-live="polite">
    <span class="ll-seed" id="llSeed">Lullaby #0000</span>
    <strong class="ll-song" id="llSong">Winding up…</strong>
    <p class="ll-pipnote" id="llNote"></p>
  </div>

  <div class="ll-roll-wrap">
    <canvas class="ll-roll" id="llRoll" role="img" aria-label="A music box pin cylinder showing the notes of the lullaby"></canvas>
  </div>
  <div class="ll-bars" id="llBars" aria-hidden="true"></div>

  <div class="ll-controls">
    <button class="ll-btn ll-play" id="llPlay" type="button" aria-pressed="false">
      <span class="ll-play-ico" aria-hidden="true">▶</span><span class="ll-play-label">Play</span>
    </button>
    <button class="ll-btn ll-ghost" id="llCompose" type="button">🎲 Compose a new one</button>

    <label class="ll-field">Tempo
      <input type="range" id="llTempo" min="36" max="100" value="54" />
      <output id="llTempoOut" for="llTempo">54</output>
    </label>

    <label class="ll-field">Sound
      <select id="llSound">
        <option value="musicbox">Music box</option>
        <option value="glass">Glass bells</option>
        <option value="harp">Soft harp</option>
      </select>
    </label>

    <label class="ll-field">Sleep timer
      <select id="llSleep">
        <option value="0">Off</option>
        <option value="2">2 min</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
      </select>
    </label>

    <label class="ll-check"><input type="checkbox" id="llEndless" /> ✨ Keep dreaming <small>(auto-compose the next one)</small></label>
  </div>

  <div class="ll-play-along">
    <p>Play along with Pip:</p>
    <div class="ll-keys" id="llKeys"></div>
  </div>

</section>
<!-- ===================== /THE LULLABY LAB ===================== -->
